; =============================================================================
; Android Scalability Settings – UE 5.4.4
; Акцент на тени, каскады и плавность. Уровни:
; 0 (Low) – тени выключены
; 1 (Medium) – для слабых устройств
; 2 (High) – оптимальное качество/производительность (тени гладкие)
; 3 (Epic) – ультра для флагманов, без излишеств
; =============================================================================

; -----------------------------------------------------------------------------
; 1. Foliage Quality
; -----------------------------------------------------------------------------
[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4
grass.CullDistanceScale=0.5

[FoliageQuality@1]
foliage.DensityScale=0.7
grass.DensityScale=0.7
grass.CullDistanceScale=0.8

[FoliageQuality@2]
foliage.DensityScale=0.9
grass.DensityScale=0.9
grass.CullDistanceScale=1.0

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
grass.CullDistanceScale=1.2

; -----------------------------------------------------------------------------
; 2. View Distance
; -----------------------------------------------------------------------------
[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6
r.NeverOcclusionTestDistance=1500

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.8
r.NeverOcclusionTestDistance=2000

[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
r.NeverOcclusionTestDistance=2500

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
r.NeverOcclusionTestDistance=3000

; -----------------------------------------------------------------------------
; 3. Shadow Quality (главный акцент)
; -----------------------------------------------------------------------------
[ShadowQuality@0]
r.ShadowQuality=0
r.Mobile.ShadowQuality=0
r.Shadow.MaxCSMResolution=0
r.Shadow.CSM.MaxCascades=0
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=1.0
r.ContactShadows=0
r.VolumetricFog=0

[ShadowQuality@1]
; Минимальные тени для слабых смартфонов: 1 каскад, низкое разрешение
r.ShadowQuality=1
r.Mobile.ShadowQuality=1
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.08
r.ContactShadows=0
r.VolumetricFog=0

[ShadowQuality@2]
; Лучшее соотношение: 2 каскада, 1024, мягкий фильтр
r.ShadowQuality=2
r.Mobile.ShadowQuality=2
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=1.5
r.Shadow.RadiusThreshold=0.05
r.ContactShadows=0
r.VolumetricFog=0

[ShadowQuality@3]
; Ультра: 3 каскада, 2048, улучшенная фильтрация
r.ShadowQuality=3
r.Mobile.ShadowQuality=3
r.Shadow.MaxCSMResolution=2048
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=1.8
r.Shadow.RadiusThreshold=0.02
r.ContactShadows=0
r.VolumetricFog=0

; -----------------------------------------------------------------------------
; 4. Post Process Quality
; -----------------------------------------------------------------------------
[PostProcessQuality@0]
r.Tonemapper.Quality=1
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=0
r.Mobile.AmbientOcclusionQuality=0
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=0

[PostProcessQuality@1]
r.Tonemapper.Quality=2
r.BloomQuality=1
r.DepthOfFieldQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=0
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=0

[PostProcessQuality@2]
r.Tonemapper.Quality=3
r.BloomQuality=1
r.DepthOfFieldQuality=1
r.LightShaftQuality=1
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=1
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=1

[PostProcessQuality@3]
r.Tonemapper.Quality=3
r.BloomQuality=2
r.DepthOfFieldQuality=1
r.LightShaftQuality=1
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=1
r.Mobile.PixelProjectedReflectionQuality=1
r.LensFlareQuality=2

; -----------------------------------------------------------------------------
; 5. Anti-Aliasing
; -----------------------------------------------------------------------------
[AntiAliasingQuality@0]
r.FXAA.Quality=0
; TAA отключено

[AntiAliasingQuality@1]
r.FXAA.Quality=0
; Слабые устройства – без AA

[AntiAliasingQuality@2]
r.FXAA.Quality=3
r.TemporalAA.Algorithm=0              ; Легковесный TAA для гладких теней
r.TemporalAA.Upsampling=0

[AntiAliasingQuality@3]
r.FXAA.Quality=0
r.TemporalAA.Algorithm=1              ; Gen5 TAA – более качественный
r.TemporalAA.Upsampling=0

; -----------------------------------------------------------------------------
; 6. Effects Quality
; -----------------------------------------------------------------------------
[EffectsQuality@0]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=4.0
r.SkyAtmosphere.FastSkyLUT.Width=96
r.SkyAtmosphere.FastSkyLUT.Height=50
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=0
fx.Niagara.QualityLevel=0

[EffectsQuality@1]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=6.0
r.SkyAtmosphere.FastSkyLUT.Width=96
r.SkyAtmosphere.FastSkyLUT.Height=50
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=0
fx.Niagara.QualityLevel=0

[EffectsQuality@2]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=8.0
r.SkyAtmosphere.FastSkyLUT.Width=96
r.SkyAtmosphere.FastSkyLUT.Height=50
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=1
fx.Niagara.QualityLevel=1

[EffectsQuality@3]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=2
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=16
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=12.0
r.SkyAtmosphere.FastSkyLUT.Width=192
r.SkyAtmosphere.FastSkyLUT.Height=100
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=2
fx.Niagara.QualityLevel=2

; -----------------------------------------------------------------------------
; 7. Texture Quality
; -----------------------------------------------------------------------------
[TextureQuality@0]
r.MaxAnisotropy=1
r.VT.MaxTilesProducedPerFrame=0

[TextureQuality@1]
r.MaxAnisotropy=1
r.VT.MaxTilesProducedPerFrame=1

[TextureQuality@2]
r.MaxAnisotropy=2
r.VT.MaxTilesProducedPerFrame=1

[TextureQuality@3]
r.MaxAnisotropy=4
r.VT.MaxTilesProducedPerFrame=2

; -----------------------------------------------------------------------------
; Scalability Preview (не менять)
; -----------------------------------------------------------------------------
[ScalabilityPreview]
CVarDenyList=r.MaxAnisotropy
+CVarDenyList=r.Streaming.Boost
+CVarDenyList=r.Streaming.AmortizeCPUToGPUCopy
+CVarDenyList=r.Streaming.MaxNumTexturesToStreamPerFrame
+CVarDenyList=r.Streaming.PoolSize