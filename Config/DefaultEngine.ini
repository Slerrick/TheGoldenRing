[/Script/Engine.RendererSettings]

; =========================================================
; MOBILE / QUEST 2 — SIMPLE, CLEAN, NON-FANCY RENDERING
; =========================================================

; Mobile Forward Renderer
r.Mobile.ShadingPath=0
r.ForwardShading=True

; HDR OFF — легче для Quest и подходит для Mobile VR
r.MobileHDR=False

; MSAA — основной AA для Quest
r.Mobile.AntiAliasing=3
r.MobileMSAA=4
r.MSAACount=4

; VR stereo rendering
vr.InstancedStereo=False
vr.MobileMultiView=False
vr.RoundRobinOcclusion=False

; Не повышаем разрешение искусственно
r.ScreenPercentage.Default=100.000000
r.ScreenPercentage.Default.Mobile.Mode=2
r.ScreenPercentage.Default.VR.Mode=0
vr.PixelDensity=1.0

; =========================================================
; LIGHTING
; =========================================================

; Обычное простое освещение без Lumen
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0

; Статическое освещение
r.AllowStaticLighting=True
r.NormalMapsForStaticLighting=True

; Skylight
r.SupportStationarySkylight=True
r.SupportLowQualityLightmaps=True

; Без современных тяжёлых систем
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=0
r.Lumen.Reflections.HardwareRayTracing.Translucent.Refraction.EnableForProject=False

; =========================================================
; SHADOWS
; =========================================================

; Обычные каскадные тени
r.Shadow.Virtual.Enable=0

; Хорошая чёткость теней без экстремальной нагрузки
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.03
r.Shadow.DistanceScale=0.85
r.Shadow.CSM.TransitionScale=1.0
r.Shadow.CSMCaching=True

; Тени от мобильного Directional Light
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableLightCSMShaderCulling=True
r.Mobile.EnableMovableDirectionalLights=True
r.Mobile.EnableMovableSpotlightsShadow=True

; Без Distance Field Shadows
r.Mobile.AllowDistanceFieldShadows=False
r.DistanceFieldShadowing=False
r.GenerateMeshDistanceFields=False

; =========================================================
; AO / POST PROCESS
; =========================================================

; Простой "Unity-like" вид без тяжёлого постпроцесса
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False

; В VR не используем Temporal AA/TSR
r.AntiAliasingMethod=3
r.TemporalAA.Upsampling=False

; =========================================================
; TEXTURES
; =========================================================

r.TextureStreaming=True
r.MeshStreaming=False

; Убираем Virtual Textures — обычные текстуры проще
r.VirtualTextures=False
r.Mobile.VirtualTextures=False
r.VT.EnableAutoImport=False
r.VirtualTexturedLightmaps=False
bEnableVirtualTextureOpacityMask=False

; Нормальные текстуры под углом
r.VT.AnisotropicFiltering=False
r.MaxAnisotropy=4

; Без искусственного ухудшения разрешения текстур
r.Streaming.MipBias=0

; =========================================================
; MOBILE QUALITY
; =========================================================

r.Mobile.FloatPrecisionMode=0
r.Mobile.UseHWsRGBEncoding=True

; Нормальное качество материалов
r.Mobile.AmbientOcclusion=False
r.Mobile.Forward.EnableLocalLights=1
r.Mobile.Forward.EnableClusteredReflections=False

; =========================================================
; GEOMETRY
; =========================================================

; Nanite на Quest не нужен
r.Nanite=0
r.Nanite.ProjectEnabled=False

; Без новых тяжёлых систем
r.HeterogeneousVolumes=False
r.HeterogeneousVolumes.Shadows=False
r.Translucency.HeterogeneousVolumes=False

; =========================================================
; FOG / ATMOSPHERE
; =========================================================

; Максимально простой вид
r.SupportSkyAtmosphere=False
r.SupportSkyAtmosphereAffectsHeightFog=False
r.SupportLocalFogVolumes=False
r.VolumetricFog.LightFunction=False

; =========================================================
; WATER / SUBSTRATE / RAYTRACING
; =========================================================

r.Substrate=False

r.RayTracing=False
r.RayTracing.Shadows=False
r.PathTracing=False

; =========================================================
; DEPTH / OCCLUSION
; =========================================================

r.AllowOcclusionQueries=True
r.EarlyZPass=2
r.EarlyZPassOnlyMaterialMasking=False

; =========================================================
; MATERIAL / BUFFER
; =========================================================

r.GBufferFormat=1
r.ClearCoatNormal=False
r.SeparateTranslucency=False
r.CustomDepth=0

; =========================================================
; OTHER
; =========================================================

r.DiscardUnusedQuality=False
r.PrecomputedVisibilityWarning=False
r.AllowGlobalClipPlane=False
r.MorphTarget.Mode=True
r.MorphTarget.MaxBlendWeight=5.000000

; Foveation OFF — не создаём размытые/пиксельные края
xr.VRS.FoveationLevel=1
xr.VRS.DynamicFoveation=False

